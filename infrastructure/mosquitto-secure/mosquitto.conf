# Secured Mosquitto 2.x broker (MQTT-07). Used by compose.secure.yaml.
# Generate acl and passwd first:  python -m services.messaging.broker_security

listener 1883

# Only registered service accounts may connect.
allow_anonymous false
password_file /mosquitto/secure/passwd

# Topic-level authorization: each account may only use its approved topics.
acl_file /mosquitto/secure/acl

persistence true
persistence_location /mosquitto/data/
max_queued_messages 10000

log_dest stdout
