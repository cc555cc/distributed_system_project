# Mosquitto 2.x broker for the transit project.
# compose.yaml mounts this directory into the container at /mosquitto/config.

# Mosquitto 2.x only listens on loopback unless a listener is declared.
listener 1883

# Anonymous demo broker. For authenticated, ACL-enforced operation use
# infrastructure/mosquitto-secure/ via compose.secure.yaml (MQTT-07).
allow_anonymous true

# Keep sessions, subscriptions and queued QoS 1 messages across broker restarts.
persistence true
persistence_location /mosquitto/data/

# Per-client QoS 1 queue. The default (1000) overflowed when 50 buses resent
# their offline backlogs to one regional subscriber at once (MQTT-11): the
# broker then drops messages for that subscriber although publishers were
# acknowledged. 10000 absorbs a ~3 s outage of a 50-bus region at 5 Hz.
max_queued_messages 10000

log_dest stdout
