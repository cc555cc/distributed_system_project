# Mosquitto 2.x broker for the transit project.
# compose.yaml mounts this directory into the container at /mosquitto/config.

# Mosquitto 2.x only listens on loopback unless a listener is declared.
listener 1883

# No credentials yet. MQTT-07 replaces this with a password file and ACLs.
allow_anonymous true

# Keep sessions, subscriptions and queued QoS 1 messages across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
