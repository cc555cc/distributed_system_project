services:
  mosquitto:
    # Fully qualified so Podman does not need a short-name registry lookup.
    image: docker.io/library/eclipse-mosquitto:2
    container_name: transit-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
