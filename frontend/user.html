<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passenger Transit</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
  <header>
    <h1>Transit System</h1>
    <nav>
      <a href="user.html" class="active">Passenger Map</a>
    </nav>
  </header>

  <main class="passenger-layout">
    <aside class="side-panel">
      <h2>Passenger: find your bus</h2>
      <p id="passenger-feed" class="note"></p>
      <label for="region-select">City / Region</label>
      <select id="region-select"></select>

      <p class="note">Click the map for nearby stops, or <button id="random-location" type="button">Try a nearby location</button></p>
      <p id="location-status" role="status"></p>
      <form id="journey-form">
        <label for="origin-stop">Your stop</label><select id="origin-stop"></select>
        <label for="destination-stop">Destination (optional)</label><select id="destination-stop"><option value="">Show approaching buses</option></select>
        <label for="party-size">Travellers</label><input id="party-size" type="number" min="1" max="20" value="1">
        <button>Find buses</button>
      </form>
      <p id="journey-status" role="status"></p>
      <h2>Best option</h2><div id="journey-results"></div>
      <h2 id="arrivals-heading">Arriving at your stop</h2><div id="stop-arrivals" class="table-wrap"></div>
      <p id="status">Loading...</p>

      <details><summary>Map routes & buses</summary><h2>Routes</h2>
      <ul id="route-list"></ul>

      <h2>Buses</h2>
      <ul id="bus-list"></ul></details>
    </aside>
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js?v=14"></script>
  <script src="js/helpers.js?v=14"></script>
  <script src="js/passenger.js?v=14"></script>
</body>
</html>
