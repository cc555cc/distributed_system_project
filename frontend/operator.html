<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=18">
</head>
<body>
  <header>
    <h1>Transit System</h1>
    <nav>
      <a href="user.html">Passenger Map</a>
      <a href="operator.html" class="active">Operator Dashboard</a>
      <a href="health.html">Bus Health</a>
      <a href="control.html">Control Panel</a>
      <button id="operator-logout">Sign out</button>
    </nav>
  </header>

  <main class="page">
    <label for="data-source">Data source</label>
    <select id="data-source"><option value="live">Live MQTT</option><option value="demo">Controlled demonstration</option></select>
    <p id="updated">Loading...</p>
    <div class="stats" id="summary"></div>

    <div class="card">
      <h2>Alerts</h2>
      <div id="alerts"></div>
    </div>

    <div class="card">
      <h2>Buses</h2>
      <div class="table-wrap" id="buses"></div>
    </div>

    <div class="card">
      <h2>Routes</h2>
      <div class="table-wrap" id="routes"></div>
    </div>

    <div class="card">
      <h2>Simulated edge servers</h2>
      <p id="simulation-clock">Loading clock...</p>
      <div class="table-wrap" id="simulation-edges"></div>
    </div>

    <div class="card">
      <h2>Edge health — selected data source</h2>
      <div class="table-wrap" id="edges"></div>
    </div>

    <div class="card">
      <h2>Edge status changes</h2>
      <p class="note">Events from the selected data source, including failures, recovery and bus reassignments.</p>
      <div id="events"></div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js?v=18"></script>
  <script src="js/helpers.js?v=18"></script>
  <script src="js/operator.js?v=18"></script>
</body>
</html>
